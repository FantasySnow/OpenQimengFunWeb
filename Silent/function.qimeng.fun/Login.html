<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>趣绮梦 - 趣标记</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!--响应式框架-->
<link rel='stylesheet' href='static/css/bootstrap.min.css'>


<!--主要样式-->
<link rel="stylesheet" href="static/css/style.css">

<style>
/*賊拉好看(?)*/
.BiaoTi {
font-size:14px;
background-clip: border-box;
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
color: #FF512F;
font-weight: 700;
text-shadow: 0px 0px 7px #ffd800;
background-image: linear-gradient(90deg, #ffd800 0%, #ff512f 100%, #fff);
animation: glow-animation 10s infinite linear;
color: #FFC0CB;
box-sizing: border-box;
vertical-align: inherit;
}

@keyframes glow-animation {
0% {
filter: hue-rotate(-360deg)
}

100% {
filter: hue-rotate(360deg)
}
}
</style>

</head>
<body>
  
<div class="container">

  <div class="card-wrap">
  
    <div class="card border-0 shadow card--welcome is-show" id="welcome">
      <div class="card-body">
        <h2 class="card-title">后台登陆</h2>
        <div class="btn-wrap">
        <a class="btn btn-lg btn-register js-btn" data-target="register" id="ptp">登 陆</a>
        <br>
        <font color="#FF9966">申请打标资格请联系<br>幻梦QQ:1137889900</font>
        <br>
        <a href="https://qimeng.fun/Web/" target="_Blank">官网</a>
        <br>
        <a rel="nofollow" href="https://beian.miit.gov.cn/" target="_blank">冀ICP备19033319号-1</a>
        </div>
      </div>
    </div>
    
    <div class="card border-0 shadow card--register" id="register">
      <div class="card-body">
        <h2 class="card-title">登 陆</h2>
        <form action="javascript:;" method="post" class="form-horizontal" role="form">
          <div class="form-group">
            <span class="input-group-addon"><span class="glyphicon glyphicon-user"></span></span>
            <input class="form-control" type="text" id="user" name="user" value="" placeholder="账号" required="required">
          </div>
          <div class="form-group">
            <span class="input-group-addon"><span class="glyphicon glyphicon-lock"></span></span>
            <input class="form-control" type="password" id="pass" name="pass" placeholder="密码" required="required">
          </div>
          <div class="form-group">
          <input type="submit" class="btn btn-lg" value="登陆">
          </div>
        </form>
      </div>
      <button class="btn btn-back js-btn" data-target="welcome"><p><</p></button>
    </div>
  </div>
  
</div>
  
<script src="static/js/index.js"></script>


</body>
</html>
